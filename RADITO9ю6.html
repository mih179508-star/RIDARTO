<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIDARTO</title>

<style>
* {
    box-sizing: border-box;
    image-rendering: pixelated;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: "Courier New", monospace;
}

button {
    font-family: "Courier New", monospace;
    image-rendering: pixelated;
}

/* ================= MENU ================= */

#menu {
    width: 100vw;
    height: 100vh;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 35px;
    position: relative;
}

#menuStars {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.menuStar {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
}

.logo {
    position: relative;
    z-index: 2;
    font-size: clamp(45px, 10vw, 90px);
    font-weight: bold;
    letter-spacing: 5px;
    margin-bottom: 5px;
    text-shadow: 4px 4px #222;
}

.logo span:nth-child(1) { color: red; }
.logo span:nth-child(2) { color: orange; }
.logo span:nth-child(3) { color: yellow; }
.logo span:nth-child(4) { color: lime; }
.logo span:nth-child(5) { color: cyan; }
.logo span:nth-child(6) { color: #2878ff; }
.logo span:nth-child(7) { color: violet; }

.subtitle {
    position: relative;
    z-index: 2;
    color: #888;
    margin-bottom: 25px;
}

/* BIGGER ROUND TABLE */

#roundBox {
    position: relative;
    z-index: 2;
    border: 5px solid white;
    padding: 20px;
    background: #000;
    box-shadow: 8px 8px #333;
}

#rounds {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    width: min(1200px, 90vw);
}

.roundButton {
    background: #050505;
    color: white;
    border: 4px solid #555;
    padding: 28px 16px;
    cursor: pointer;
    font-weight: bold;
    font-size: 20px;
    min-height: 110px;
}

.roundButton:hover:not(:disabled) {
    background: white;
    color: black;
}

.roundButton:disabled {
    color: #333;
    border-color: #222;
    cursor: not-allowed;
}

.tip {
    position: relative;
    z-index: 2;
    margin-top: 25px;
    color: #555;
    font-size: 12px;
}

/* ================= GAME ================= */

#game {
    display: none;
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
}

#gameCanvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

#hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    z-index: 10;
    pointer-events: none;
}

.hudBox {
    background: #000;
    border: 3px solid white;
    padding: 6px 10px;
    font-size: 13px;
    font-weight: bold;
    box-shadow: 3px 3px #333;
}

.bar {
    width: 130px;
    height: 10px;
    border: 2px solid white;
    background: #222;
    margin-top: 4px;
}

#playerHP {
    width: 100%;
    height: 100%;
    background: #20ff30;
}

#bossHP {
    width: 100%;
    height: 100%;
    background: red;
}

#message {
    position: absolute;
    z-index: 20;
    left: 0;
    right: 0;
    top: 40%;
    text-align: center;
    font-size: clamp(25px, 6vw, 55px);
    font-weight: bold;
    text-shadow: 5px 5px #000;
    pointer-events: none;
}

#endButtons {
    display: none;
    position: absolute;
    z-index: 30;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    gap: 15px;
}

.endButton {
    min-width: 140px;
    padding: 12px 20px;
    background: #000;
    color: white;
    border: 4px solid white;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 5px 5px #333;
}

.endButton:hover {
    background: white;
    color: black;
}

.controls {
    position: absolute;
    right: 12px;
    bottom: 12px;
    color: #555;
    font-size: 11px;
    z-index: 10;
}

/* ================= MOBILE ================= */

@media(max-width:600px) {

    #rounds {
        grid-template-columns: 1fr;
        width: 80vw;
    }

    .roundButton {
        min-height: 75px;
        padding: 15px;
        font-size: 16px;
    }

    .controls {
        display: none;
    }

    .bar {
        width: 80px;
    }
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menu">

    <div id="menuStars"></div>

    <div class="logo">
        <span>R</span>
        <span>I</span>
        <span>D</span>
        <span>A</span>
        <span>R</span>
        <span>T</span>
        <span>O</span>
    </div>

    <div class="subtitle">
        ★ PIXEL SPACE BOSS GAME ★
    </div>

    <div id="roundBox">
        <div id="rounds"></div>
    </div>

    <div class="tip">
        WASD = MOVE | MOUSE = AIM | LEFT CLICK = FIRE
    </div>

</div>


<!-- ================= GAME ================= -->

<div id="game">

    <canvas id="gameCanvas"></canvas>

    <div id="hud">

        <div class="hudBox">
            HP
            <div class="bar">
                <div id="playerHP"></div>
            </div>
        </div>

        <div class="hudBox">
            BOSS
            <div class="bar">
                <div id="bossHP"></div>
            </div>
        </div>

        <div class="hudBox">
            TIME: <span id="timer">60</span>
        </div>

    </div>

    <div id="message"></div>

    <div id="endButtons">

        <button
            class="endButton"
            id="restart">
            RESTART
        </button>

        <button
            class="endButton"
            id="menuButton">
            MENU
        </button>

    </div>

    <div class="controls">
        WASD — MOVE | MOUSE — AIM | LEFT CLICK — FIRE
    </div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const W = 640;
const H = 360;

canvas.width = W;
canvas.height = H;

ctx.imageSmoothingEnabled = false;


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;

function startAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if (
        audioContext.state === "suspended"
    ) {
        audioContext.resume();
    }
}


function sound(
    frequency,
    duration,
    type = "square",
    volume = 0.04
) {

    startAudio();

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    const now =
        audioContext.currentTime;

    osc.type = type;

    osc.frequency.setValueAtTime(
        frequency,
        now
    );

    gain.gain.setValueAtTime(
        volume,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + duration
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start(now);
    osc.stop(now + duration);
}


/* =====================================================
   GREEN LASER CHARGE SOUND
===================================================== */

function greenChargeSound() {

    startAudio();

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    const now =
        audioContext.currentTime;

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        80,
        now
    );

    osc.frequency.exponentialRampToValueAtTime(
        1000,
        now + 0.9
    );

    gain.gain.setValueAtTime(
        0.001,
        now
    );

    gain.gain.linearRampToValueAtTime(
        0.055,
        now + 0.8
    );

    gain.gain.linearRampToValueAtTime(
        0.001,
        now + 1
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start(now);
    osc.stop(now + 1);
}


function greenShotSound() {

    sound(
        1000,
        0.08,
        "square",
        0.04
    );
}


/* =====================================================
   INPUT
===================================================== */

const keys = {};

window.addEventListener(
    "keydown",
    e => {
        keys[e.code] = true;
    }
);

window.addEventListener(
    "keyup",
    e => {
        keys[e.code] = false;
    }
);


const mouse = {

    x: W / 2,
    y: H / 2,
    down: false

};


canvas.addEventListener(
    "mousemove",
    e => {

        const rect =
            canvas.getBoundingClientRect();

        mouse.x =
            (e.clientX - rect.left) /
            rect.width * W;

        mouse.y =
            (e.clientY - rect.top) /
            rect.height * H;
    }
);


canvas.addEventListener(
    "mousedown",
    () => {

        mouse.down = true;
        startAudio();

    }
);


window.addEventListener(
    "mouseup",
    () => {

        mouse.down = false;

    }
);


/* =====================================================
   STARS
===================================================== */

let stars = [];


function makeStars() {

    stars = [];

    for (let i = 0; i < 160; i++) {

        stars.push({

            x: Math.random() * W,
            y: Math.random() * H,

            speed:
                10 +
                Math.random() * 40,

            size:
                Math.random() > 0.85
                ? 3
                : 2

        });
    }
}


const menuStars =
    document.getElementById(
        "menuStars"
    );


for (let i = 0; i < 120; i++) {

    const star =
        document.createElement("div");

    star.className =
        "menuStar";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    menuStars.appendChild(star);
}


/* =====================================================
   GAME VARIABLES
===================================================== */

let player;
let boss;

let bullets = [];
let lasers = [];
let particles = [];

let currentRound = 1;

let unlockedRound = 1;

let gameRunning = false;
let gameEnded = false;

let roundStartTime = 0;

let positionHistory = [];


/* =====================================================
   PLAYER
===================================================== */

function createPlayer() {

    player = {

        x: 100,
        y: H / 2,

        speed: 190,

        hp: 100,
        maxHp: 100,

        shootCooldown: 0

    };
}


/* =====================================================
   BOSS
===================================================== */

function createBoss(round) {

    let bossHP;


    /*
     * ROUND 1
     * 100 HP
     *
     * ROUND 2
     * 130 HP
     *
     * ROUND 3
     * 500 HP
     */

    if (round === 3) {

        bossHP = 500;

    }
    else {

        bossHP =
            100 +
            (round - 1) * 30;

    }


    boss = {

        x: W - 100,
        y: H / 2,

        hp: bossHP,
        maxHp: bossHP,

        size:
            round === 3
            ? 42
            : 34,

        moveTime: 0,

        redAttackTimer: 0,

        /*
         * GREEN LASER
         *
         * ROUND 1 = DISABLED
         * ROUND 2 = ENABLED
         * ROUND 3 = ENABLED
         */

        greenState:
            round >= 2
            ? "rest"
            : "disabled",

        greenTimer:
            round >= 2
            ? 5
            : Infinity,

        greenTarget: null,

        helperAttackTimer: 1.5,

        helpers: []

    };


    /*
     * ROUND 3 HELPERS
     */

    if (round === 3) {

        boss.helpers = [

            {
                side: -1
            },

            {
                side: 1
            }

        ];

    }
}


/* =====================================================
   START ROUND
===================================================== */

function startRound(round) {

    currentRound = round;

    document.getElementById("menu")
        .style.display = "none";

    document.getElementById("game")
        .style.display = "block";

    document.getElementById("endButtons")
        .style.display = "none";

    document.getElementById("message")
        .textContent = "";

    createPlayer();

    createBoss(round);

    makeStars();

    bullets = [];
    lasers = [];
    particles = [];

    positionHistory = [];

    gameRunning = true;
    gameEnded = false;

    roundStartTime =
        performance.now();


    let roundTime = 60;


    if (currentRound === 2) {

        roundTime = 90;

    }


    if (currentRound === 3) {

        roundTime = 300;

    }


    document.getElementById("timer")
        .textContent = roundTime;


    sound(300, 0.08);

    setTimeout(
        () => sound(500, 0.08),
        100
    );
}


/* =====================================================
   ROUND BUTTONS
===================================================== */

function updateRoundButtons() {

    const container =
        document.getElementById(
            "rounds"
        );

    container.innerHTML = "";


    /*
     * ONLY 3 ROUNDS
     */

    for (let i = 1; i <= 3; i++) {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "roundButton";

        button.textContent =
            "ROUND " + i;

        button.disabled =
            i > unlockedRound;

        button.onclick =
            () => startRound(i);

        container.appendChild(button);

    }
}


updateRoundButtons();


/* =====================================================
   PLAYER SHOOT
===================================================== */

function playerShoot() {

    if (
        player.shootCooldown > 0
    ) {
        return;
    }


    const angle =
        Math.atan2(
            mouse.y - player.y,
            mouse.x - player.x
        );


    bullets.push({

        x: player.x,
        y: player.y,

        vx:
            Math.cos(angle) * 500,

        vy:
            Math.sin(angle) * 500,

        life: 1

    });


    player.shootCooldown =
        0.14;


    sound(
        800,
        0.035,
        "square",
        0.025
    );
}


/* =====================================================
   RED LASER
===================================================== */

function shootRedLaser() {

    const angle =
        Math.atan2(
            player.y - boss.y,
            player.x - boss.x
        );


    lasers.push({

        type: "red",

        x: boss.x,
        y: boss.y,

        vx:
            Math.cos(angle) * 280,

        vy:
            Math.sin(angle) * 280,

        life: 2

    });


    sound(
        100,
        0.18,
        "sawtooth",
        0.045
    );
}


/* =====================================================
   HELPER LASER
===================================================== */

function shootHelperLaser(
    x,
    y
) {

    const angle =
        Math.atan2(
            player.y - y,
            player.x - x
        );


    lasers.push({

        type: "red",

        x: x,
        y: y,

        vx:
            Math.cos(angle) * 230,

        vy:
            Math.sin(angle) * 230,

        life: 1.5,

        helperShot: true

    });


    sound(
        130,
        0.08,
        "square",
        0.025
    );
}


/* =====================================================
   OLD PLAYER POSITION
===================================================== */

function getPastPlayerPosition(
    secondsAgo
) {

    const wantedTime =
        performance.now() -
        secondsAgo * 1000;


    let best = null;

    let difference =
        Infinity;


    for (
        const point
        of positionHistory
    ) {

        const d =
            Math.abs(
                point.time -
                wantedTime
            );


        if (d < difference) {

            difference = d;
            best = point;

        }
    }


    if (!best) {

        return {

            x: player.x,
            y: player.y

        };

    }


    return {

        x: best.x,
        y: best.y

    };
}


/* =====================================================
   GREEN LASER
===================================================== */

function startGreenCharge() {

    boss.greenTarget =
        getPastPlayerPosition(2);

    boss.greenState =
        "charge";

    boss.greenTimer = 1;

    greenChargeSound();
}


function fireGreenLaser() {

    const target =
        boss.greenTarget;


    const angle =
        Math.atan2(
            target.y - boss.y,
            target.x - boss.x
        );


    lasers.push({

        type: "green",

        x: boss.x,
        y: boss.y,

        dx:
            Math.cos(angle),

        dy:
            Math.sin(angle),

        length: 1000,

        life: 1,

        maxLife: 1

    });


    greenShotSound();
}


/* =====================================================
   BOSS ATTACKS
===================================================== */

function updateBossAttack(
    delta
) {

    /*
     * RED LASERS
     *
     * ALL 3 ROUNDS.
     */

    boss.redAttackTimer -= delta;


    if (
        boss.redAttackTimer <= 0
    ) {

        shootRedLaser();


        boss.redAttackTimer =
            currentRound === 3
            ? 0.8
            : Math.max(
                0.5,
                1.3 -
                currentRound * 0.06
            );
    }


    /*
     * ROUND 3 HELPERS
     */

    if (
        currentRound === 3
    ) {

        boss.helperAttackTimer -=
            delta;


        if (
            boss.helperAttackTimer <= 0
        ) {

            for (
                const helper
                of boss.helpers
            ) {

                const position =
                    getHelperPosition(
                        helper
                    );


                shootHelperLaser(
                    position.x,
                    position.y
                );
            }


            boss.helperAttackTimer =
                1.7;
        }
    }


    /*
     * GREEN LASER
     *
     * ONLY ROUND 2 + 3
     */

    if (
        currentRound >= 2
    ) {

        boss.greenTimer -=
            delta;


        if (
            boss.greenState ===
            "rest"
        ) {

            if (
                boss.greenTimer <= 0
            ) {

                startGreenCharge();

            }
        }


        else if (
            boss.greenState ===
            "charge"
        ) {

            if (
                boss.greenTimer <= 0
            ) {

                fireGreenLaser();

                boss.greenState =
                    "laser";

                boss.greenTimer =
                    1;
            }
        }


        else if (
            boss.greenState ===
            "laser"
        ) {

            if (
                boss.greenTimer <= 0
            ) {

                lasers =
                    lasers.filter(
                        laser =>
                            laser.type !==
                            "green"
                    );


                boss.greenState =
                    "rest";


                /*
                 * EXACTLY 5 SECONDS
                 * WITHOUT GREEN LASER.
                 */

                boss.greenTimer = 5;
            }
        }
    }
}


/* =====================================================
   HELPER POSITION
===================================================== */

function getHelperPosition(
    helper
) {

    const distance = 62;


    return {

        x:
            boss.x +
            helper.side *
            distance,

        y:
            boss.y +
            Math.sin(
                boss.moveTime * 2
            ) * 18

    };
}


/* =====================================================
   PARTICLES
===================================================== */

function explode(
    x,
    y,
    color
) {

    for (
        let i = 0;
        i < 15;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI * 2;


        const speed =
            30 +
            Math.random() * 120;


        particles.push({

            x: x,
            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life: 0.4,

            color: color

        });
    }
}


/* =====================================================
   UPDATE
===================================================== */

function update(delta) {

    if (
        !gameRunning ||
        gameEnded
    ) {
        return;
    }


    /* TIMER */

    let totalTime = 60;


    if (
        currentRound === 2
    ) {

        totalTime = 90;

    }


    if (
        currentRound === 3
    ) {

        totalTime = 300;

    }


    const elapsed =
        (
            performance.now() -
            roundStartTime
        ) / 1000;


    const remaining =
        Math.max(
            0,
            totalTime -
            elapsed
        );


    document.getElementById(
        "timer"
    ).textContent =
        Math.ceil(remaining);


    if (
        remaining <= 0
    ) {

        loseGame();

        return;
    }


    /* PLAYER MOVEMENT */

    let dx = 0;
    let dy = 0;


    if (
        keys["KeyW"]
    ) dy--;


    if (
        keys["KeyS"]
    ) dy++;


    if (
        keys["KeyA"]
    ) dx--;


    if (
        keys["KeyD"]
    ) dx++;


    if (
        dx !== 0 ||
        dy !== 0
    ) {

        const length =
            Math.hypot(
                dx,
                dy
            );


        dx /= length;
        dy /= length;


        player.x +=
            dx *
            player.speed *
            delta;


        player.y +=
            dy *
            player.speed *
            delta;

    }


    player.x =
        Math.max(
            15,
            Math.min(
                W - 15,
                player.x
            )
        );


    player.y =
        Math.max(
            15,
            Math.min(
                H - 15,
                player.y
            )
        );


    /* POSITION HISTORY */

    positionHistory.push({

        time:
            performance.now(),

        x: player.x,
        y: player.y

    });


    const historyLimit =
        performance.now() -
        3000;


    positionHistory =
        positionHistory.filter(
            p =>
                p.time >=
                historyLimit
        );


    /* SHOOT */

    player.shootCooldown -=
        delta;


    if (
        mouse.down
    ) {

        playerShoot();

    }


    /* BOSS MOVEMENT */

    boss.moveTime +=
        delta;


    boss.y =
        H / 2 +
        Math.sin(
            boss.moveTime * 1.6
        ) * 95;


    /* ATTACK */

    updateBossAttack(delta);


    /* =================================================
       PLAYER BULLETS
    ================================================= */

    for (
        const bullet
        of bullets
    ) {

        bullet.x +=
            bullet.vx *
            delta;


        bullet.y +=
            bullet.vy *
            delta;


        bullet.life -=
            delta;


        /*
         * ROUND 3 SHIELDS
         *
         * HELPERS CANNOT DIE.
         */

        if (
            currentRound === 3
        ) {

            for (
                const helper
                of boss.helpers
            ) {

                const hp =
                    getHelperPosition(
                        helper
                    );


                const distance =
                    Math.hypot(
                        bullet.x -
                        hp.x,

                        bullet.y -
                        hp.y
                    );


                if (
                    distance < 18
                ) {

                    bullet.life = 0;


                    explode(
                        bullet.x,
                        bullet.y,
                        "#00aaff"
                    );


                    sound(
                        120,
                        0.04,
                        "square",
                        0.025
                    );


                    break;
                }
            }
        }


        /*
         * BOSS HIT
         */

        if (
            bullet.life > 0
        ) {

            const distance =
                Math.hypot(
                    bullet.x -
                    boss.x,

                    bullet.y -
                    boss.y
                );


            if (
                distance <
                boss.size
            ) {

                bullet.life = 0;


                boss.hp -=
                    3 +
                    currentRound *
                    0.3;


                explode(
                    bullet.x,
                    bullet.y,
                    "#ffff00"
                );


                sound(
                    180,
                    0.025
                );
            }
        }
    }


    bullets =
        bullets.filter(
            b =>
                b.life > 0 &&
                b.x > -50 &&
                b.x < W + 50 &&
                b.y > -50 &&
                b.y < H + 50
        );


    /* =================================================
       LASERS
    ================================================= */

    for (
        const laser
        of lasers
    ) {

        if (
            laser.type === "red"
        ) {

            laser.x +=
                laser.vx *
                delta;


            laser.y +=
                laser.vy *
                delta;


            laser.life -=
                delta;


            const distance =
                Math.hypot(
                    laser.x -
                    player.x,

                    laser.y -
                    player.y
                );


            if (
                distance < 16
            ) {

                laser.life = 0;


                player.hp -= 20;


                explode(
                    player.x,
                    player.y,
                    "#ff0000"
                );


                sound(
                    70,
                    0.15,
                    "sawtooth"
                );
            }
        }


        else if (
            laser.type ===
            "green"
        ) {

            /*
             * GREEN LASER DOES NOT
             * DAMAGE THE PLAYER.
             */

            laser.life -=
                delta;

        }
    }


    lasers =
        lasers.filter(
            laser =>
                laser.life > 0
        );


    /* PARTICLES */

    for (
        const particle
        of particles
    ) {

        particle.x +=
            particle.vx *
            delta;


        particle.y +=
            particle.vy *
            delta;


        particle.life -=
            delta;
    }


    particles =
        particles.filter(
            p =>
                p.life > 0
        );


    /* HUD */

    document.getElementById(
        "playerHP"
    ).style.width =

        Math.max(
            0,
            player.hp /
            player.maxHp *
            100
        ) + "%";


    document.getElementById(
        "bossHP"
    ).style.width =

        Math.max(
            0,
            boss.hp /
            boss.maxHp *
            100
        ) + "%";


    if (
        boss.hp <= 0
    ) {

        winGame();

        return;
    }


    if (
        player.hp <= 0
    ) {

        loseGame();

    }
}


/* =====================================================
   DRAW
===================================================== */

function draw() {

    ctx.fillStyle = "#000";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* STARS */

    for (
        const star
        of stars
    ) {

        star.x -=
            star.speed * 0.02;


        if (
            star.x < 0
        ) {

            star.x = W;

        }


        ctx.fillStyle = "#fff";


        ctx.fillRect(
            Math.floor(star.x),
            Math.floor(star.y),
            star.size,
            star.size
        );
    }


    if (!gameRunning) {
        return;
    }


    /* BULLETS */

    for (
        const bullet
        of bullets
    ) {

        ctx.fillStyle =
            "#ffff00";


        ctx.fillRect(
            Math.floor(
                bullet.x - 3
            ),

            Math.floor(
                bullet.y - 2
            ),

            7,
            4
        );
    }


    /* LASERS */

    for (
        const laser
        of lasers
    ) {

        if (
            laser.type ===
            "green"
        ) {

            const alpha =
                Math.max(
                    0,
                    laser.life /
                    laser.maxLife
                );


            const endX =
                laser.x +
                laser.dx *
                laser.length;


            const endY =
                laser.y +
                laser.dy *
                laser.length;


            /*
             * GREEN GLOW
             */

            ctx.globalAlpha =
                alpha * 0.25;


            ctx.strokeStyle =
                "#00ff33";


            ctx.lineWidth = 18;


            ctx.beginPath();


            ctx.moveTo(
                laser.x,
                laser.y
            );


            ctx.lineTo(
                endX,
                endY
            );


            ctx.stroke();


            /*
             * MAIN LASER
             */

            ctx.globalAlpha =
                alpha;


            ctx.strokeStyle =
                "#00ff33";


            ctx.lineWidth = 8;


            ctx.beginPath();


            ctx.moveTo(
                laser.x,
                laser.y
            );


            ctx.lineTo(
                endX,
                endY
            );


            ctx.stroke();


            /*
             * WHITE CENTER
             */

            ctx.strokeStyle =
                "#d0ffdd";


            ctx.lineWidth = 2;


            ctx.beginPath();


            ctx.moveTo(
                laser.x,
                laser.y
            );


            ctx.lineTo(
                endX,
                endY
            );


            ctx.stroke();


            ctx.globalAlpha = 1;

        }

        else {

            ctx.fillStyle =
                "#ff0000";


            ctx.fillRect(
                Math.floor(
                    laser.x - 4
                ),

                Math.floor(
                    laser.y - 4
                ),

                9,
                9
            );


            ctx.fillStyle =
                "#ff7777";


            ctx.fillRect(
                Math.floor(
                    laser.x - 2
                ),

                Math.floor(
                    laser.y - 2
                ),

                4,
                4
            );
        }
    }


    /* =================================================
       PLAYER ROCKET
    ================================================= */

    const angle =
        Math.atan2(
            mouse.y -
            player.y,

            mouse.x -
            player.x
        );


    ctx.save();


    ctx.translate(
        Math.floor(player.x),
        Math.floor(player.y)
    );


    ctx.rotate(angle);


    /* FLAME */

    ctx.fillStyle =
        "#ff2200";


    ctx.fillRect(
        -22,
        -5,
        9,
        10
    );


    ctx.fillStyle =
        "#ffff00";


    ctx.fillRect(
        -29,
        -3,
        7,
        6
    );


    /* BODY */

    ctx.fillStyle =
        "#168cff";


    ctx.fillRect(
        -13,
        -8,
        27,
        16
    );


    /* WINGS */

    ctx.fillStyle =
        "#0750a0";


    ctx.fillRect(
        -8,
        -14,
        10,
        6
    );


    ctx.fillRect(
        -8,
        8,
        10,
        6
    );


    /* WINDOW */

    ctx.fillStyle =
        "#dfffff";


    ctx.fillRect(
        3,
        -5,
        8,
        10
    );


    ctx.fillStyle =
        "#4ddaff";


    ctx.fillRect(
        5,
        -3,
        4,
        6
    );


    ctx.restore();


    /* =================================================
       ROUND 3 HELPERS
    ================================================= */

    if (
        currentRound === 3
    ) {

        for (
            const helper
            of boss.helpers
        ) {

            const hp =
                getHelperPosition(
                    helper
                );


            const hx =
                Math.floor(hp.x);

            const hy =
                Math.floor(hp.y);


            /* SHIELD GLOW */

            ctx.fillStyle =
                "rgba(0,170,255,0.18)";


            ctx.fillRect(
                hx - 19,
                hy - 19,
                38,
                38
            );


            /* OUTER */

            ctx.fillStyle =
                "#0066aa";


            ctx.fillRect(
                hx - 14,
                hy - 14,
                28,
                28
            );


            /* BODY */

            ctx.fillStyle =
                "#00aaff";


            ctx.fillRect(
                hx - 10,
                hy - 10,
                20,
                20
            );


            /* CORE */

            ctx.fillStyle =
                "#bfffff";


            ctx.fillRect(
                hx - 5,
                hy - 5,
                10,
                10
            );


            /* SHIELD SIDES */

            ctx.fillStyle =
                "#55ddff";


            ctx.fillRect(
                hx - 18,
                hy - 4,
                5,
                8
            );


            ctx.fillRect(
                hx + 13,
                hy - 4,
                5,
                8
            );
        }
    }


    /* =================================================
       BOSS
    ================================================= */

    const bx =
        Math.floor(boss.x);

    const by =
        Math.floor(boss.y);


    const bossColor =
        currentRound === 3
        ? "#ff0055"
        : "#dd0000";


    const darkBossColor =
        currentRound === 3
        ? "#710025"
        : "#570000";


    ctx.fillStyle =
        darkBossColor;


    ctx.fillRect(
        bx - 40,
        by - 24,
        80,
        48
    );


    ctx.fillStyle =
        bossColor;


    ctx.fillRect(
        bx - 31,
        by - 31,
        62,
        62
    );


    ctx.fillStyle =
        darkBossColor;


    ctx.fillRect(
        bx - 21,
        by - 21,
        42,
        42
    );


    ctx.fillStyle =
        "#ff7777";


    ctx.fillRect(
        bx - 8,
        by - 8,
        16,
        16
    );


    ctx.fillStyle =
        "#fff";


    ctx.fillRect(
        bx - 3,
        by - 3,
        6,
        6
    );


    ctx.strokeStyle =
        currentRound === 3
        ? "#ff00aa"
        : "#ff0000";


    ctx.lineWidth = 4;


    ctx.strokeRect(
        bx - 36,
        by - 36,
        72,
        72
    );


    /* PARTICLES */

    for (
        const particle
        of particles
    ) {

        ctx.globalAlpha =
            Math.max(
                0,
                particle.life * 2
            );


        ctx.fillStyle =
            particle.color;


        ctx.fillRect(
            Math.floor(
                particle.x
            ),

            Math.floor(
                particle.y
            ),

            5,
            5
        );
    }


    ctx.globalAlpha = 1;
}


/* =====================================================
   WIN
===================================================== */

function winGame() {

    if (gameEnded) {
        return;
    }


    gameEnded = true;


    document.getElementById(
        "message"
    ).textContent =
        "★ YOU WIN ★";


    document.getElementById(
        "endButtons"
    ).style.display =
        "flex";


    /*
     * ONLY 3 ROUNDS
     */

    if (
        currentRound ===
        unlockedRound &&
        unlockedRound < 3
    ) {

        unlockedRound++;

    }


    updateRoundButtons();


    sound(
        523,
        0.12
    );


    setTimeout(
        () =>
            sound(
                659,
                0.12
            ),
        120
    );


    setTimeout(
        () =>
            sound(
                784,
                0.25
            ),
        240
    );
}


/* =====================================================
   GAME OVER
===================================================== */

function loseGame() {

    if (gameEnded) {
        return;
    }


    gameEnded = true;


    document.getElementById(
        "message"
    ).textContent =
        "GAME OVER";


    document.getElementById(
        "endButtons"
    ).style.display =
        "flex";


    sound(
        110,
        0.2,
        "sawtooth"
    );


    setTimeout(
        () =>
            sound(
                70,
                0.35,
                "sawtooth"
            ),
        200
    );
}


/* =====================================================
   RESTART
===================================================== */

document.getElementById(
    "restart"
).onclick = () => {

    startRound(
        currentRound
    );

};


/* =====================================================
   MENU
===================================================== */

document.getElementById(
    "menuButton"
).onclick = () => {

    gameRunning = false;
    gameEnded = false;


    document.getElementById(
        "game"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "flex";


    document.getElementById(
        "endButtons"
    ).style.display =
        "none";


    document.getElementById(
        "message"
    ).textContent =
        "";


    updateRoundButtons();

};


/* =====================================================
   GAME LOOP
===================================================== */

let lastTime =
    performance.now();


function gameLoop(time) {

    const delta =
        Math.min(
            0.033,
            (time - lastTime) /
            1000
        );


    lastTime = time;


    update(delta);

    draw();


    requestAnimationFrame(
        gameLoop
    );
}


makeStars();

requestAnimationFrame(
    gameLoop
);

</script>
